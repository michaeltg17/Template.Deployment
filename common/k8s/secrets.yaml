# On AWS the app-secrets / api-config Secrets are OWNED by External Secrets
# Operator (see aws/k8s/external-secret.yaml) and synced from AWS Secrets
# Manager at runtime, so the baked Secrets below are skipped on the AWS path
# (the `skip-if: aws` annotation, matched by deploy.sh) - the password/key
# never enter the manifests. On Azure (and any non-AWS cloud) they are applied
# as before, rendered from environments/<env>.secrets.env. Do NOT commit filled
# values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app
  annotations:
    skip-if: "aws"
type: Opaque
stringData:
  image-api-key: "__IMAGE_API_KEY__"
---
# Connection string for the RDS PostgreSQL instance (private endpoint,
# rendered from environments/<env>.env + <env>.secrets.env). SSL is required
# by RDS (rds.force_ssl defaults on for PG 15+); the RDS CA is not pinned
# here, so trust the certificate the server presents.
apiVersion: v1
kind: Secret
metadata:
  name: api-config
  namespace: app
  annotations:
    skip-if: "aws"
type: Opaque
stringData:
  postgresql-connection-string: "Host=__RDS_ENDPOINT__;Port=5432;Database=template_db;Username=__DB_USER__;Password=__DB_PASSWORD__;SSL Mode=Require;Trust Server Certificate=true"
