# API_URL is injected per environment at deploy time (one image, many envs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: react-config
  namespace: app
data:
  API_URL: "__API_URL__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  namespace: app
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: react
                topologyKey: kubernetes.io/hostname
      containers:
        - name: react
          image: ghcr.io/michaeltg17/template-react:__REACT_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: react-config
                  key: API_URL
          # Readiness gates traffic: the page must actually respond. Given a
          # real timeout so a slow first render does not flap the pod.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Liveness only needs "is the server process up" - a TCP check is
          # robust against slow page renders (an HTTP liveness here killed
          # the pod on its 1s default timeout).
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: react
  namespace: app
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
  ports:
    - name: http
      port: 80
      targetPort: 3000
