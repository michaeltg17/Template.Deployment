# One-shot migration runner (dbup). Re-run with a new image tag on upgrades:
#   kubectl -n app delete job migrations && kubectl -n app apply -f migrations-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: app
  labels:
    app: migrations
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrations
    spec:
      restartPolicy: Never
      initContainers:
        # RDS (created by terraform) - wait until it accepts connections.
        # __RDS_ENDPOINT__ / __DB_USER__ are rendered by deploy.sh.
        - name: wait-for-db
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h __RDS_ENDPOINT__ -p 5432 -U __DB_USER__ -d template_db; do
                sleep 2
              done
      containers:
        - name: migrations
          image: ghcr.io/michaeltg17/template-db-migrations:__MIGRATIONS_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: api-config
                  key: postgresql-connection-string
