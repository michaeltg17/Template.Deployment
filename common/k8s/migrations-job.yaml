# One-shot migration runner (dbup). Re-run with a new image tag on upgrades:
#   kubectl -n app delete job migrations && kubectl -n app apply -f migrations-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: app
  labels:
    app: migrations
  annotations:
    # ArgoCD GitOps hook: run the migrations Job before each sync (PreSync) and
    # delete it on success, so a new Job is created on every deploy (a Job's
    # spec.template is immutable - re-applying the same name would fail). dbup
    # is idempotent, so re-running on each sync is safe.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrations
    spec:
      restartPolicy: Never
      initContainers:
        # RDS (created by terraform) - wait until it accepts connections.
        # __RDS_ENDPOINT__ is rendered by deploy.sh. pg_isready does not
        # authenticate, so no -U/-d credentials are needed (and DB_USER is
        # empty on AWS, where the login lives in the ESO-synced secret).
        - name: wait-for-db
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h __RDS_ENDPOINT__ -p 5432 -d template_db; do
                sleep 2
              done
      containers:
        - name: migrations
          image: ghcr.io/michaeltg17/template-db-migrations:__MIGRATIONS_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: api-config
                  key: postgresql-connection-string
