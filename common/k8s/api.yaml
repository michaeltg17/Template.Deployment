apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api
                topologyKey: kubernetes.io/hostname
      initContainers:
        # RDS (created by terraform) - wait until it accepts connections.
        # __RDS_ENDPOINT__ is rendered by deploy.sh. pg_isready does not
        # authenticate, so no -U/-d credentials are needed (and DB_USER is
        # empty on AWS, where the login lives in the ESO-synced secret).
        - name: wait-for-db
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h __RDS_ENDPOINT__ -p 5432 -d template_db; do
                sleep 2
              done
      containers:
        - name: api
          image: ghcr.io/michaeltg17/template-api:__API_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: TemplateApi__PostgreSqlConnectionString
              valueFrom:
                secretKeyRef:
                  name: api-config
                  key: postgresql-connection-string
            - name: TemplateApi__ImageApiUrl
              value: "__IMAGE_API_URL__"
            - name: TemplateApi__ImageApiKey
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: image-api-key
          # Readiness gates traffic and, on azure, drives the App Gateway health
          # probe (AGIC uses the pod's httpGet readiness path). It must confirm
          # the API is up AND can reach the DB. On aws the ALB health check is
          # set separately via a Service annotation added by deploy.sh.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
