# Manual continuous deployment: deploys the app repos' (Template.Api, Template.React)
# image tags to an EKS environment. The app repos build and push ghcr images
# themselves (tagged <sha7> + latest); this workflow picks the sha7 of the
# app repos' main HEAD (or an explicit override) and runs common/k8s/deploy.sh.
#
# Trigger: Actions tab -> "Deploy" -> choose env (optionally pin tags) -> Run.
#
# Auth: the workflow assumes the per-env GitHub OIDC role created by
# terraform (`terraform output -raw cd_role_arn`). No stored kubeconfig:
# kubectl talks to EKS via `aws eks update-kubeconfig` (its exec creds
# call `aws eks get-token` per request).
#
# Resource names are derived from the env: cluster template-<env>,
# RDS instance template-<env>-db (the endpoint is resolved at runtime with the
# aws CLI, so nothing goes stale).
#
# Secrets/config live in AWS, not GitHub: the DB login (app or master) + image
# API key are in Secrets Manager and synced into the cluster by External Secrets
# Operator; the image API base URL is in SSM Parameter Store
# (template/<env>/image-api-url) and read here. The ONLY per-env GitHub value is
# the CD role ARN as a repo VARIABLE (from `terraform output -raw cd_role_arn`).
#
# Required per env (repo settings):
#   vars:    AWS_ROLE_ARN_<ENV>   (from `terraform output -raw cd_role_arn`)

name: Deploy (AWS)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, qa, prod]
        default: dev
      api_tag:
        description: "Optional - api + migrations image sha7 (empty = main HEAD)"
        type: string
        default: ""
      react_tag:
        description: "Optional - react image sha7 (empty = main HEAD)"
        type: string
        default: ""

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.event.inputs.env }}
      CLUSTER_NAME: template-${{ github.event.inputs.env }}
      RDS_IDENTIFIER: template-${{ github.event.inputs.env }}-db
      SSM_IMAGE_API_URL: /template/${{ github.event.inputs.env }}/image-api-url
      # ESO values are deterministic from the env name - passed to deploy.sh so
      # it does not need `terraform init` in CI.
      AWS_REGION: us-east-1
      DB_SECRET_NAME: template-${{ github.event.inputs.env }}-db
      IMAGE_API_SECRET_NAME: template-${{ github.event.inputs.env }}-image-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        run: curl -fsSL https://get.k8s.io | bash

      - name: "DIAGNOSTIC: decode OIDC token header (kid)"
        run: |
          set +e
          echo "=== ID_TOKEN_REQUEST_URL ==="
          echo "$ID_TOKEN_REQUEST_URL"
          echo "=== token token present? ==="
          [ -n "$ID_TOKEN_REQUEST_TOKEN" ] && echo "yes" || echo "no"
          echo "=== curl (with audience) ==="
          token=$(curl -sS -H "Authorization: bearer $ID_TOKEN_REQUEST_TOKEN" "$ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" 2>&1)
          echo "token length: ${#token}"
          echo "token first 200: $(printf '%s' "$token" | cut -c1-200)"
          header=$(printf '%s' "$token" | cut -d. -f1)
          padded=$(printf '%s' "$header" | awk '{n=length($0)%4; if(n==2) print $0"=="; else if(n==3) print $0"="; else print $0}')
          echo "=== JWT header decoded ==="
          printf '%s' "$padded" | base64 -d 2>&1; echo ""
          set -e

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', github.event.inputs.env)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tags (main HEAD sha7, or explicit override)
        env:
          API_TAG_OVERRIDE: ${{ github.event.inputs.api_tag }}
          REACT_TAG_OVERRIDE: ${{ github.event.inputs.react_tag }}
        run: |
          api_tag="${API_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.Api.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          react_tag="${REACT_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.React.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          [ -n "$api_tag" ] || { echo "ERROR: could not resolve an api image tag"; exit 1; }
          [ -n "$react_tag" ] || { echo "ERROR: could not resolve a react image tag"; exit 1; }
          echo "Deploying api=$api_tag react=$react_tag to $ENV_NAME"
          {
            echo "API_TAG=$api_tag"
            echo "REACT_TAG=$react_tag"
          } >> "$GITHUB_ENV"

      - name: Resolve AWS resource values (RDS endpoint + image API URL)
        run: |
          rds_endpoint=$(aws rds describe-db-instances --db-instance-identifier "$RDS_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          if [ -z "$rds_endpoint" ] || [ "$rds_endpoint" = "None" ]; then
            echo "ERROR: RDS instance $RDS_IDENTIFIER not found (terraform not applied for this env?)"
            exit 1
          fi
          image_api_url=$(aws ssm get-parameter --name "$SSM_IMAGE_API_URL" \
            --with-decryption --query 'Parameter.Value' --output text)
          if [ -z "$image_api_url" ] || [ "$image_api_url" = "None" ]; then
            echo "ERROR: SSM parameter $SSM_IMAGE_API_URL not found (terraform not applied for this env?)"
            exit 1
          fi
          echo "RDS_ENDPOINT=$rds_endpoint" >> "$GITHUB_ENV"
          echo "IMAGE_API_URL=$image_api_url" >> "$GITHUB_ENV"

      - name: Render env file (no secrets file on AWS - ESO owns the secrets)
        run: |
          : "${IMAGE_API_URL:?could not read the image API URL from SSM}"
          : "${RDS_ENDPOINT:?could not resolve the RDS endpoint}"
          sed \
            -e "s|^IMAGE_API_URL=.*|IMAGE_API_URL=$IMAGE_API_URL|" \
            -e "s|^RDS_ENDPOINT=.*|RDS_ENDPOINT=$RDS_ENDPOINT|" \
            -e "s|^API_IMAGE_TAG=.*|API_IMAGE_TAG=$API_TAG|" \
            -e "s|^MIGRATIONS_IMAGE_TAG=.*|MIGRATIONS_IMAGE_TAG=$API_TAG|" \
            -e "s|^REACT_IMAGE_TAG=.*|REACT_IMAGE_TAG=$REACT_TAG|" \
            "common/k8s/environments/$ENV_NAME.env.example" > "common/k8s/environments/$ENV_NAME.env"

      - name: Configure kubectl (EKS)
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl version --client
          kubectl get nodes

      - name: Deploy
        run: bash common/k8s/deploy.sh "$ENV_NAME" aws
