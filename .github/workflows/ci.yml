name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run CI checks in docker
        run: bash common/ci-docker.sh

  # Plan (read-only) on every PR to main, for each cloud + env. The plan
  # identity is assumable from any ref (AWS) / the pull_request event (Azure),
  # so this never needs the apply identity. The plan job plans BOTH the main
  # state and the argocd state (the argocd state reads the cluster from the
  # main state).
  #
  # The plan identity is a repo var (AWS role ARN) / secret (Azure MI client
  # id), populated once after the first (local) apply of that env from
  # `terraform output`. Until an env is bootstrapped (roles created + var/secret
  # set) its plan row FAILS (red) on purpose - this is an intentional,
  # non-blocking signal that the env still needs its one-time local bootstrap.
  # Once the env exists, add this check to branch protection as required.
  terraform-plan:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cloud: aws,   env: dev }
          - { cloud: aws,   env: qa }
          - { cloud: aws,   env: prod }
          - { cloud: azure, env: dev }
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials (GitHub OIDC, plan role)
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_PLAN_ROLE_ARN_{0}', matrix.env)] }}
          aws-region: us-east-1

      - name: Configure Azure credentials (GitHub OIDC, tf-plan MI)
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets[format('AZURE_TF_PLAN_CLIENT_ID_{0}', matrix.env)] }}
          tenant-id: ${{ secrets[format('AZURE_TENANT_ID_{0}', matrix.env)] }}
          subscription-id: ${{ secrets[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.env)] }}

      - name: Plan main state
        working-directory: ${{ matrix.cloud }}/terraform/environments/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color | tee "plan-${{ matrix.cloud }}-${{ matrix.env }}-main.out"

      - name: Plan argocd state (reads cluster from main state)
        working-directory: ${{ matrix.cloud }}/terraform/environments/${{ matrix.env }}/argocd
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color | tee "plan-${{ matrix.cloud }}-${{ matrix.env }}-argocd.out"

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.cloud }}-${{ matrix.env }}
          path: |
            ${{ matrix.cloud }}/terraform/environments/${{ matrix.env }}/plan-*.out
            ${{ matrix.cloud }}/terraform/environments/${{ matrix.env }}/argocd/plan-*.out
          if-no-files-found: warn

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract PR number from merge commit
        id: extract-pr
        run: |
          MERGE_MSG=$(git log -1 --format=%B)
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oP '#\K[0-9]+' | head -1)
          if [ -z "$PR_NUMBER" ]; then
            echo "ERROR: no PR number found in merge commit message (all changes to main must go through a PR):"
            echo "$MERGE_MSG"
            exit 1
          fi
          echo "PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fetch PR title and notes
        id: pr-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Fetching PR #${{ steps.extract-pr.outputs.pr_number }}"
          PR_JSON=$(gh pr view "${{ steps.extract-pr.outputs.pr_number }}" --repo "${{ github.repository }}" --json title,body)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body')
          echo "::endgroup::"
          echo "PR title: $PR_TITLE"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$PR_BODY" > release-notes.txt
          cat release-notes.txt

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          gh release create "$SHORT_SHA" \
            --target "${{ github.sha }}" \
            --title "${{ steps.pr-notes.outputs.pr_title }}" \
            --notes-file release-notes.txt \
            --latest
