name: ci

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run CI checks in docker
        run: bash common/ci-docker.sh

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract PR number from merge commit
        id: extract-pr
        run: |
          MERGE_MSG=$(git log -1 --format=%B)
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oP '#\K[0-9]+' | head -1)
          if [ -z "$PR_NUMBER" ]; then
            echo "ERROR: no PR number found in merge commit message (all changes to main must go through a PR):"
            echo "$MERGE_MSG"
            exit 1
          fi
          echo "PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fetch PR title and notes
        id: pr-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Fetching PR #${{ steps.extract-pr.outputs.pr_number }}"
          PR_JSON=$(gh pr view "${{ steps.extract-pr.outputs.pr_number }}" --repo "${{ github.repository }}" --json title,body)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body')
          echo "::endgroup::"
          echo "PR title: $PR_TITLE"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$PR_BODY" > release-notes.txt
          cat release-notes.txt

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          gh release create "$SHORT_SHA" \
            --target "${{ github.sha }}" \
            --title "${{ steps.pr-notes.outputs.pr_title }}" \
            --notes-file release-notes.txt \
            --latest
