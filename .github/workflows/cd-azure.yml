# Continuous deployment (Azure, GitOps): renders the app stack manifests for an
# AKS environment and commits them to deploy/<env>/azure/. ArgoCD (installed by
# terraform) watches that path on main and syncs it into the cluster - this
# workflow never talks to kubectl.
#
# The app repos (Template.Api, Template.React) build and push ghcr images
# themselves (tagged <sha7> + latest); this workflow picks the sha7 of the app
# repos' main HEAD (or an explicit override) and renders the manifests with
# those tags.
#
# Trigger: Actions tab -> "Deploy (Azure)" -> choose env (optionally pin tags) -> Run.
#
# Auth: GitHub OIDC federated to the per-env CD service principal created by
# terraform (`terraform output -raw cd_client_id` / `cd_tenant_id`). No stored
# kubeconfig, no kubectl: the only cluster write is ArgoCD syncing the commit.
# The federated identity is bound to the dev + main branch refs (see modules/aks).
#
# The deploy job runs under the <env>-<cloud> environment (dev-azure); prod is
# gated by that environment's required reviewers (prod-azure).
#
# Required per env (under the <env>-<cloud> environment):
#   secrets: AZURE_CLIENT_ID            (from `terraform output -raw cd_client_id`)
#            AZURE_TENANT_ID            (from `terraform output -raw cd_tenant_id`)
#            AZURE_SUBSCRIPTION_ID
#            DB_PASSWORD                (must match the PG admin password in tfvars)
#            IMAGE_API_KEY
#   vars:    IMAGE_API_URL              (image API base URL for that env)

env:
  # Project name: the suffix of every resource name (env-first: <env>-<project>)
  PROJECT: template

name: Deploy (Azure)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, qa, prod]
        default: dev
      api_tag:
        description: "Optional - api + migrations image sha7 (empty = main HEAD)"
        type: string
        default: ""
      react_tag:
        description: "Optional - react image sha7 (empty = main HEAD)"
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.env }}-azure
    permissions:
      contents: write
      id-token: write
    env:
      ENV_NAME: ${{ github.event.inputs.env }}
      RESOURCE_GROUP: ${{ github.event.inputs.env }}-${{ env.PROJECT }}-rg
      AKS_NAME: ${{ github.event.inputs.env }}-${{ env.PROJECT }}
      PG_NAME: ${{ github.event.inputs.env }}-${{ env.PROJECT }}-pg
      IMAGE_API_URL: ${{ vars.IMAGE_API_URL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Azure credentials (GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tags (main HEAD sha7, or explicit override)
        env:
          API_TAG_OVERRIDE: ${{ github.event.inputs.api_tag }}
          REACT_TAG_OVERRIDE: ${{ github.event.inputs.react_tag }}
        run: |
          api_tag="${API_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.Api.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          react_tag="${REACT_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.React.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          [ -n "$api_tag" ] || { echo "ERROR: could not resolve an api image tag"; exit 1; }
          [ -n "$react_tag" ] || { echo "ERROR: could not resolve a react image tag"; exit 1; }
          echo "Deploying api=$api_tag react=$react_tag to $ENV_NAME"
          {
            echo "API_TAG=$api_tag"
            echo "REACT_TAG=$react_tag"
          } >> "$GITHUB_ENV"

      - name: Resolve Azure resource values (PG endpoint + user)
        run: |
          rds_endpoint=$(az postgres flexible-server show --name "$PG_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.fqdn" -o tsv)
          db_user=$(az postgres flexible-server show --name "$PG_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.administratorLogin" -o tsv)
          if [ -z "$rds_endpoint" ] || [ "$rds_endpoint" = "None" ]; then
            echo "ERROR: PostgreSQL Flexible Server $PG_NAME not found (terraform not applied for this env?)"
            exit 1
          fi
          echo "RDS_ENDPOINT=$rds_endpoint" >> "$GITHUB_ENV"
          echo "DB_USER=$db_user" >> "$GITHUB_ENV"

      - name: Render env files
        run: |
          : "${IMAGE_API_URL:?set the IMAGE_API_URL variable in the $ENV_NAME-azure environment}"
          : "${DB_PASSWORD:?set the DB_PASSWORD secret in the $ENV_NAME-azure environment}"
          : "${IMAGE_API_KEY:?set the IMAGE_API_KEY secret in the $ENV_NAME-azure environment}"
          sed \
            -e "s|^IMAGE_API_URL=.*|IMAGE_API_URL=$IMAGE_API_URL|" \
            -e "s|^RDS_ENDPOINT=.*|RDS_ENDPOINT=$RDS_ENDPOINT|" \
            -e "s|^DB_USER=.*|DB_USER=$DB_USER|" \
            -e "s|^API_IMAGE_TAG=.*|API_IMAGE_TAG=$API_TAG|" \
            -e "s|^MIGRATIONS_IMAGE_TAG=.*|MIGRATIONS_IMAGE_TAG=$API_TAG|" \
            -e "s|^REACT_IMAGE_TAG=.*|REACT_IMAGE_TAG=$REACT_TAG|" \
            "common/k8s/environments/$ENV_NAME.env.example" > "common/k8s/environments/$ENV_NAME.env"
          printf 'DB_PASSWORD=%s\nIMAGE_API_KEY=%s\n' "$DB_PASSWORD" "$IMAGE_API_KEY" > "common/k8s/environments/$ENV_NAME.secrets.env"

      - name: Render manifests (GitOps - no kubectl)
        run: bash common/k8s/render.sh "$ENV_NAME" azure "deploy/$ENV_NAME/azure"

      - name: Commit rendered manifests to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "deploy/$ENV_NAME/azure"
          if git diff --cached --quiet; then
            echo "No manifest changes for $ENV_NAME/azure - nothing to commit."
            exit 0
          fi
          git commit -m "deploy(azure): $ENV_NAME api=$API_TAG react=$REACT_TAG"
          git push origin HEAD:main
