# Manual continuous deployment (Azure): deploys the app repos' (Template.Api,
# Template.React) image tags to an AKS environment. The app repos build and push
# ghcr images themselves (tagged <sha7> + latest); this workflow picks the sha7
# of the app repos' main HEAD (or an explicit override) and runs
# common/k8s/deploy.sh <env> azure.
#
# Trigger: Actions tab -> "Deploy (Azure)" -> choose env (optionally pin tags) -> Run.
#
# Auth: GitHub OIDC federated to the per-env CD service principal created by
# terraform (`terraform output -raw cd_client_id` / `cd_tenant_id`). No stored
# kubeconfig: kubectl talks to AKS via `az aks get-credentials`. The federated
# identity is bound to the dev + main branch refs (see modules/aks).
#
# Required per env (repo settings):
#   secrets: AZURE_CLIENT_ID_<ENV>      (from `terraform output -raw cd_client_id`)
#            AZURE_TENANT_ID_<ENV>      (from `terraform output -raw cd_tenant_id`)
#            AZURE_SUBSCRIPTION_ID_<ENV>
#            DB_PASSWORD_<ENV>          (must match the PG admin password in tfvars)
#            IMAGE_API_KEY_<ENV>
#   vars:    IMAGE_API_URL_<ENV>        (image API base URL for that env)

name: Deploy (Azure)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, qa, prod]
        default: dev
      api_tag:
        description: "Optional - api + migrations image sha7 (empty = main HEAD)"
        type: string
        default: ""
      react_tag:
        description: "Optional - react image sha7 (empty = main HEAD)"
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.event.inputs.env }}
      RESOURCE_GROUP: template-${{ github.event.inputs.env }}-rg
      AKS_NAME: template-${{ github.event.inputs.env }}
      PG_NAME: template-${{ github.event.inputs.env }}-pg
      IMAGE_API_URL: ${{ vars['IMAGE_API_URL_' + github.event.inputs.env] }}
      DB_PASSWORD: ${{ secrets['DB_PASSWORD_' + github.event.inputs.env] }}
      IMAGE_API_KEY: ${{ secrets['IMAGE_API_KEY_' + github.event.inputs.env] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        run: curl -fsSL https://get.k8s.io | bash

      - name: Configure Azure credentials (GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets['AZURE_CLIENT_ID_' + github.event.inputs.env] }}
          tenant-id: ${{ secrets['AZURE_TENANT_ID_' + github.event.inputs.env] }}
          subscription-id: ${{ secrets['AZURE_SUBSCRIPTION_ID_' + github.event.inputs.env] }}

      - name: Resolve image tags (main HEAD sha7, or explicit override)
        env:
          API_TAG_OVERRIDE: ${{ github.event.inputs.api_tag }}
          REACT_TAG_OVERRIDE: ${{ github.event.inputs.react_tag }}
        run: |
          api_tag="${API_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.Api.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          react_tag="${REACT_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/Template.React.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          [ -n "$api_tag" ] || { echo "ERROR: could not resolve an api image tag"; exit 1; }
          [ -n "$react_tag" ] || { echo "ERROR: could not resolve a react image tag"; exit 1; }
          echo "Deploying api=$api_tag react=$react_tag to $ENV_NAME"
          {
            echo "API_TAG=$api_tag"
            echo "REACT_TAG=$react_tag"
          } >> "$GITHUB_ENV"

      - name: Resolve Azure resource values (PG endpoint + user)
        run: |
          rds_endpoint=$(az postgres flexible-server show --name "$PG_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.fqdn" -o tsv)
          db_user=$(az postgres flexible-server show --name "$PG_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.administratorLogin" -o tsv)
          if [ -z "$rds_endpoint" ] || [ "$rds_endpoint" = "None" ]; then
            echo "ERROR: PostgreSQL Flexible Server $PG_NAME not found (terraform not applied for this env?)"
            exit 1
          fi
          echo "RDS_ENDPOINT=$rds_endpoint" >> "$GITHUB_ENV"
          echo "DB_USER=$db_user" >> "$GITHUB_ENV"

      - name: Render env files
        run: |
          : "${IMAGE_API_URL:?set the IMAGE_API_URL_$ENV_NAME repository variable}"
          : "${DB_PASSWORD:?set the DB_PASSWORD_$ENV_NAME repository secret}"
          : "${IMAGE_API_KEY:?set the IMAGE_API_KEY_$ENV_NAME repository secret}"
          sed \
            -e "s|^IMAGE_API_URL=.*|IMAGE_API_URL=$IMAGE_API_URL|" \
            -e "s|^RDS_ENDPOINT=.*|RDS_ENDPOINT=$RDS_ENDPOINT|" \
            -e "s|^DB_USER=.*|DB_USER=$DB_USER|" \
            -e "s|^API_IMAGE_TAG=.*|API_IMAGE_TAG=$API_TAG|" \
            -e "s|^MIGRATIONS_IMAGE_TAG=.*|MIGRATIONS_IMAGE_TAG=$API_TAG|" \
            -e "s|^REACT_IMAGE_TAG=.*|REACT_IMAGE_TAG=$REACT_TAG|" \
            "common/k8s/environments/$ENV_NAME.env.example" > "common/k8s/environments/$ENV_NAME.env"
          printf 'DB_PASSWORD=%s\nIMAGE_API_KEY=%s\n' "$DB_PASSWORD" "$IMAGE_API_KEY" > "common/k8s/environments/$ENV_NAME.secrets.env"

      - name: Configure kubectl (AKS)
        run: |
          az aks get-credentials --name "$AKS_NAME" --resource-group "$RESOURCE_GROUP"
          kubectl version --client
          kubectl get nodes

      - name: Deploy
        run: bash common/k8s/deploy.sh "$ENV_NAME" azure
