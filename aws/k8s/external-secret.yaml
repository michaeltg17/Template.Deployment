# ESO syncs the env's AWS Secrets Manager secrets into in-cluster k8s Secrets.
# The secret NAMES (__DB_SECRET_NAME__ / __IMAGE_API_SECRET_NAME__) and the RDS
# endpoint (__RDS_ENDPOINT__) are rendered by deploy.sh from terraform outputs.
# The DB password and image API key are NEVER in these manifests - ESO pulls
# them from Secrets Manager at runtime (and re-syncs on rotation).
#
#   app-secrets  <- template-<env>-image-api  (image-api-key)
#   api-config   <- template-<env>-db         (username, password -> connection string)
#
# The api-config connection string is built with an ESO v2 template: the
# password (and username) come from the synced remote values, the host is the
# rendered RDS endpoint. The app keeps reading one full connection string.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: image-api-key
      remoteRef:
        key: __IMAGE_API_SECRET_NAME__
        property: key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-config
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: api-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        postgresql-connection-string: "Host=__RDS_ENDPOINT__;Port=5432;Database=template_db;Username={{ .username }};Password={{ .password }};SSL Mode=Require;Trust Server Certificate=true"
  data:
    - secretKey: username
      remoteRef:
        key: __DB_SECRET_NAME__
        property: username
    - secretKey: password
      remoteRef:
        key: __DB_SECRET_NAME__
        property: password
