# Cluster-scoped store so the app-namespace ExternalSecrets can reference it.
# ESO authenticates to AWS Secrets Manager via IRSA: it projects a token for the
# `external-secrets` service account (created by the ESO helm install in
# bootstrap/setup-eks.sh, annotated with the ESO IRSA role ARN) and assumes the
# role with it. The role may only read this env's two secrets.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
