# Single entry point. /api/* goes to the API, everything else to the Next.js
# app. The ALB itself (internet-facing, :80, own security group) is created
# and managed by the AWS Load Balancer Controller from this Ingress - see
# bootstrap/setup-eks.sh. The app URL is the ALB DNS name in
# .status.loadBalancer (no domain in dev).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: app
  labels:
    app: app
  annotations:
    kubernetes.io/ingress.class: alb
    # public ALB
    alb.ingress.kubernetes.io/scheme: internet-facing
    # plain HTTP for now (no domain/cert)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # route to pod IPs directly (no node ports needed)
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react
                port:
                  number: 80
